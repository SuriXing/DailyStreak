# Ruff 配置：仓库内唯一的 Python 代码是 .uxe/scripts 工具脚本。
# 本地运行：python3 -m ruff check .uxe/scripts（npm run lint:py）
[tool.ruff]
target-version = "py39"
line-length = 100
extend-exclude = ["node_modules", "dist", ".expo"]

[tool.ruff.lint]
select = [
  "E4", "E7", "E9", # pycodestyle 错误（语法/缩进/未定义）
  "F",              # pyflakes（未使用导入、未定义名称）
  "I",              # 导入排序
  "B",              # bugbear（常见 bug 模式）
  "UP",             # pyupgrade（过时语法）
  "SIM",            # 简化建议
  "RUF",            # ruff 专属规则
]

[tool.ruff.lint.per-file-ignores]
# .uxe 是随工具链引入的 vendored 脚本：豁免与上游可 diff 性冲突的风格类规则，
# 第一方 Python 代码不受影响。
".uxe/scripts/**" = [
  "BLE001", # CLI 脚本用宽泛 except 捕获并上报错误，属有意设计
  "EXE002", # 工具脚本 shebang 文件不必强制可执行位
  "PLW1510",# subprocess 不加 check 属有意的 fire-and-report
  "SIM102", # 嵌套 if 展开会降低与上游的可 diff 性
  "RUF005", # 列表拼接改解包属纯风格改写
  "RUF046", # int(round(x)) 属防御性写法
]

[tool.ruff.lint.isort]
known-first-party = ["uxe_contract_core", "uxe_ai_detector_bridge"]
