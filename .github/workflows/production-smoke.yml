name: Production smoke

# 每天验证一次"线上真的能用"：登录 → 注册 → 打卡 → 三个 Tab → 零控制台错误。
# 为什么需要它：CI 里的冒烟测试打的是本地 dev server，站点上线后仍然可能坏的
# —— 例如数据库项目被暂停、部署被 Vercel 的访问保护挡住、环境变量丢失。
# 这类故障本地全绿也照样存在，只有对真实域名跑一次才看得见。
on:
  schedule:
    # 每天 02:41 UTC（北京时间 10:41）
    - cron: '41 2 * * *'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: 安装 Playwright 浏览器
        run: npx playwright install --with-deps chromium

      - name: 对线上站点跑冒烟测试
        env:
          # 可在仓库变量 PRODUCTION_URL 里覆盖；默认是自定义域名
          SMOKE_BASE: ${{ vars.PRODUCTION_URL || 'https://dailystreak.suri.world' }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          echo "目标站点：$SMOKE_BASE"
          npm run smoke
