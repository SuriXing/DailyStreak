name: Supabase keep-alive

# Supabase 免费项目在 7 天无活动后会被暂停；这里每天 ping 一次 REST 端点保活。
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST endpoint（必要时自动恢复暂停的项目）
        env:
          SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::warning::未配置 EXPO_PUBLIC_SUPABASE_URL/ANON_KEY secrets，跳过保活。"
            exit 0
          fi

          # 免费项目被暂停后 DNS 不再解析，curl 会以退出码 6 失败。这里必须吞掉退出码，
          # 否则 set -e 会在判断之前就终止整个步骤——这正是它连续失败四天的原因。
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$SUPABASE_URL/rest/v1/" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY" || echo "000")
          echo "Supabase ping -> HTTP $code"
          case "$code" in
            2*|4*) echo "项目已响应（保活成功）"; exit 0 ;;
          esac

          echo "::warning::保活请求异常 HTTP $code（项目很可能已被暂停：暂停后 DNS 停止解析）"
          ref=$(printf '%s' "$SUPABASE_URL" | sed -E 's#^https?://([^.]+)\..*$#\1#')
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::未配置 SUPABASE_ACCESS_TOKEN，无法自动恢复，请到 Supabase 控制台手动恢复项目 $ref"
            exit 1
          fi
          echo "尝试通过 Management API 恢复项目 $ref …"
          curl -sS --max-time 60 -X POST "https://api.supabase.com/v1/projects/$ref/restore" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" -d '{}' >/dev/null || true
          status=""
          for i in 1 2 3 4 5 6; do
            sleep 20
            status=$(curl -sS --max-time 20 "https://api.supabase.com/v1/projects/$ref" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin).get("status",""))' 2>/dev/null || echo "")
            echo "  第 $i 次检查：status=$status"
            [ "$status" = "ACTIVE_HEALTHY" ] && break
          done
          if [ "$status" = "ACTIVE_HEALTHY" ]; then
            echo "项目已恢复并处于 ACTIVE_HEALTHY。"
          else
            echo "::error::项目仍未就绪（status=$status），请到 Supabase 控制台确认 $ref"
            exit 1
          fi
